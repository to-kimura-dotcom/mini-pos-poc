<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミニPOS PoC</title>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#183049;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}header{background:#102c44;color:white;padding:18px max(20px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:24px}header small{color:#cbd9e5}main{max-width:1100px;margin:24px auto;padding:0 16px}nav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 15px;background:#e5ebf0;color:#183049}button:hover{filter:brightness(.96)}button.primary{background:#086aa7;color:white}button.danger{background:#fff1f0;color:#b53333}button:disabled{opacity:.55;cursor:not-allowed}nav button.active{background:#102c44;color:white}.panel{background:white;border:1px solid #dce5ec;border-radius:14px;padding:20px;box-shadow:0 2px 9px #1e40540a}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid #dce5ec;background:#fff;text-align:left;min-height:76px}.item strong,.item span{display:block}.item span{color:#557089;margin-top:5px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#667d91}.total{font-size:24px;font-weight:750;border-top:2px solid #dce5ec;padding-top:14px}.field{display:grid;gap:5px;margin:12px 0}input{border:1px solid #b9c9d6;border-radius:8px;padding:10px;min-width:0;width:100%}input:focus,button:focus-visible{outline:3px solid #86c8ed;outline-offset:2px}.cartline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid #e8eef2;padding:9px 0}.cartline input{width:72px}.notice{padding:10px;border-radius:8px;background:#eaf5ff;color:#154a72;margin:12px 0}.error{background:#fff0ed;color:#a32720}.success{background:#e8f8ed;color:#196037}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e3ebf0}th{background:#edf3f8}td.num,th.num{text-align:right}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar .field{margin:0}section[hidden]{display:none}.receipt{max-width:420px;margin:16px auto;border:1px dashed #91a5b4;padding:20px;background:white}.receipt h2{text-align:center}.receipt .row{padding:3px 0}footer{margin:25px 0;color:#667d91;font-size:13px}@media(max-width:760px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.panel{padding:15px}table{font-size:13px}th,td{padding:7px}}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 22px}.kpi{border:1px solid #dce5ec;border-radius:12px;padding:17px;background:#f8fbfd}.kpi span{display:block;color:#557089;font-size:13px}.kpi strong{display:block;font-size:25px;margin-top:6px;color:#102c44}.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}.chartbox{border:1px solid #dce5ec;border-radius:12px;padding:16px;min-width:0}.chartbox h3{margin:0 0 4px}.chartbox p{font-size:13px;margin:0 0 14px;color:#667d91}.barrow{display:grid;grid-template-columns:minmax(95px,1fr) minmax(80px,2fr) 75px;align-items:center;gap:9px;margin:12px 0;font-size:13px}.barlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:20px;background:#edf3f8;border-radius:5px;overflow:hidden}.fill{height:100%;background:#1674a9;border-radius:5px}.barval{text-align:right;font-weight:700}.chartscroll{overflow-x:auto}.hours{height:188px;display:flex;align-items:stretch;gap:4px;min-width:500px;border-bottom:1px solid #b9c9d6}.hour{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:16px}.hourbar{width:75%;background:#46a1c7;min-height:0;border-radius:4px 4px 0 0}.hourbar.peak{background:#086aa7}.hour small{height:17px;font-size:10px;color:#60788b}.chartnote{font-size:12px;color:#667d91;margin-top:8px}.empty{padding:22px;background:#f8fbfd;border-radius:9px;color:#667d91;text-align:center}@media(max-width:760px){.charts{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi strong{font-size:20px}}@media(max-width:440px){.kpis{grid-template-columns:1fr}}
</style></head><body>
<header><h1>ミニPOS <small>PoC</small></h1><small>学習用カフェレジ｜ブラウザ内にデータを保存</small></header>
<main><nav aria-label="画面切替"><button class="active" data-tab="register">レジ</button><button data-tab="products">商品管理</button><button data-tab="sales">売上集計</button></nav><div id="message" role="status" aria-live="polite"></div>
<section id="register"><div class="layout"><div class="panel"><h2>商品を選ぶ</h2><div id="productGrid" class="grid"></div></div><div class="panel"><h2>会計</h2><div id="cart"></div><div class="row total"><span>合計</span><span id="total">¥0</span></div><label class="field">お預かり金額（円）<input id="cash" type="number" inputmode="numeric" min="0" step="1" placeholder="例：2000"></label><div class="row"><span>お釣り</span><strong id="change">—</strong></div><p><button id="checkout" class="primary">会計を確定</button> <button id="clearCart">カートを空にする</button></p></div></div><div id="receipt"></div></section>
<section id="products" hidden><div class="panel"><h2>商品管理</h2><form id="productForm" class="toolbar"><input id="editId" type="hidden"><label class="field">商品名<input id="productName" required maxlength="60" placeholder="例：カフェラテ"></label><label class="field">税込価格（円）<input id="productPrice" required type="number" min="1" max="999999" step="1"></label><button class="primary" type="submit" id="saveProduct">商品を追加</button><button type="button" id="cancelEdit" hidden>編集を取り消す</button></form><div style="overflow-x:auto"><table><thead><tr><th>商品名</th><th class="num">税込価格</th><th>状態</th><th>操作</th></tr></thead><tbody id="productRows"></tbody></table></div></div></section>
<section id="sales" hidden><div class="panel"><h2>日別売上</h2><label class="field" style="max-width:230px">集計日<input type="date" id="salesDate"></label><div id="summary" class="muted" role="status"></div><div id="kpis" class="kpis"></div><div class="charts"><div class="chartbox"><h3>商品別売上ランキング</h3><p>金額順。右端は売上額、ラベルには販売点数を表示</p><div id="productChart"></div></div><div class="chartbox"><h3>時間帯別売上</h3><p>何時台に売上が集中したかを表示</p><div id="hourChart" class="chartscroll"></div></div></div><h3>会計履歴</h3><div style="overflow-x:auto"><table><thead><tr><th>会計番号</th><th>時刻</th><th>点数</th><th class="num">合計</th><th>詳細</th></tr></thead><tbody id="salesRows"></tbody></table></div></div></section>
<footer>学習用の試作品です。実際の決済・税額計算・複数端末同期には対応していません。ブラウザの保存データを消すと履歴も消えます。</footer></main>
<script>
'use strict';
const KEY='mini-pos-poc-v1';
const initialNames=[['ブレンドコーヒー',400],['カフェラテ',480],['紅茶',380],['オレンジジュース',350],['チーズケーキ',520],['チョコケーキ',550],['クロワッサン',320],['サンドイッチ',650],['クッキー',180],['ミネラルウォーター',150]];
const seed=()=>({products:initialNames.map(([name,price],i)=>({id:i+1,name,price,active:true})),sales:[],nextProductId:11,nextSaleId:1});
let db;
try{const saved=localStorage.getItem(KEY);db=saved?JSON.parse(saved):seed();if(!Array.isArray(db.products)||!Array.isArray(db.sales))throw Error('invalid');}catch{db=seed();}
let cart=new Map();const $=id=>document.getElementById(id),yen=n=>'¥'+Number(n).toLocaleString('ja-JP');
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const stamp=iso=>new Date(iso).toLocaleString('ja-JP');
function notice(msg,type='notice'){$('message').className=type;$('message').textContent=msg;}
function save(next){try{localStorage.setItem(KEY,JSON.stringify(next));db=next;return true}catch{notice('保存に失敗しました。ブラウザの空き容量を確認してください。','notice error');return false}}
function el(tag,text,cls){const x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x}
function showTab(name){for(const s of ['register','products','sales'])$(s).hidden=s!==name;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));render()}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
function render(){renderRegister();renderProducts();renderSales()}
function renderRegister(){const grid=$('productGrid');grid.replaceChildren();db.products.filter(p=>p.active).forEach(p=>{const b=el('button','', 'item');b.append(el('strong',p.name),el('span',yen(p.price)));b.onclick=()=>{cart.set(p.id,(cart.get(p.id)||0)+1);renderRegister()};grid.append(b)});const c=$('cart');c.replaceChildren();let total=0;for(const [id,qty] of cart){const p=db.products.find(x=>x.id===id);if(!p)continue;total+=p.price*qty;const row=el('div','', 'cartline');const label=el('span',p.name+' '+yen(p.price));const inp=el('input');inp.type='number';inp.min='1';inp.max='99';inp.step='1';inp.value=qty;inp.setAttribute('aria-label',p.name+'の数量');inp.onchange=()=>{let v=Number(inp.value);if(!Number.isInteger(v)||v<1||v>99){notice('数量は1～99の整数で入力してください。','notice error');inp.value=qty;return}cart.set(id,v);renderRegister()};const del=el('button','削除');del.setAttribute('aria-label',p.name+'を削除');del.onclick=()=>{cart.delete(id);renderRegister()};row.append(label,inp,del);c.append(row)}if(!cart.size)c.append(el('p','商品を選んでください。','muted'));$('total').textContent=yen(total);const cash=Number($('cash').value);$('change').textContent=$('cash').value!==''&&Number.isInteger(cash)&&cash>=total&&total>0?yen(cash-total):'—';$('checkout').disabled=!cart.size}
$('cash').addEventListener('input',renderRegister);$('clearCart').onclick=()=>{cart.clear();$('cash').value='';renderRegister()};
$('checkout').onclick=()=>{if(!cart.size)return;const items=[];let total=0;for(const [id,qty] of cart){const p=db.products.find(x=>x.id===id);if(!p||!p.active){notice('販売停止の商品があります。カートを確認してください。','notice error');return}if(!Number.isInteger(qty)||qty<1||qty>99)return;const subtotal=p.price*qty;total+=subtotal;items.push({productId:id,name:p.name,unitPrice:p.price,quantity:qty,subtotal})}const cash=Number($('cash').value);if($('cash').value===''||!Number.isSafeInteger(cash)||cash<total){notice('合計以上の預かり金額を整数で入力してください。','notice error');return}const sale={id:db.nextSaleId,at:new Date().toISOString(),items,total,cash,change:cash-total};const next={...db,sales:[...db.sales,sale],nextSaleId:db.nextSaleId+1};$('checkout').disabled=true;if(!save(next)){$('checkout').disabled=false;return}cart.clear();$('cash').value='';render();renderReceipt(sale);notice('会計を保存しました。','notice success')};
function renderReceipt(sale){const r=$('receipt');r.replaceChildren();const box=el('div','', 'receipt');box.append(el('h2','レシート'),el('p','会計番号 #'+sale.id+'　'+stamp(sale.at)));for(const item of sale.items){const row=el('div','', 'row');row.append(el('span',item.name+' × '+item.quantity),el('span',yen(item.subtotal)));box.append(row)}for(const [a,b] of [['合計',sale.total],['お預かり',sale.cash],['お釣り',sale.change]]){const row=el('div','', 'row');row.append(el('strong',a),el('strong',yen(b)));box.append(row)}r.append(box)}
function renderProducts(){const rows=$('productRows');rows.replaceChildren();db.products.forEach(p=>{const tr=el('tr');const name=el('td',p.name),price=el('td',yen(p.price),'num'),status=el('td',p.active?'販売中':'販売停止'),action=el('td');const edit=el('button','編集');edit.onclick=()=>{$('editId').value=p.id;$('productName').value=p.name;$('productPrice').value=p.price;$('saveProduct').textContent='変更を保存';$('cancelEdit').hidden=false;$('productName').focus()};const toggle=el('button',p.active?'販売停止':'販売再開');toggle.onclick=()=>{const next={...db,products:db.products.map(x=>x.id===p.id?{...x,active:!x.active}:x)};if(save(next)){render();notice('商品の状態を更新しました。')}};action.append(edit,' ',toggle);tr.append(name,price,status,action);rows.append(tr)})}
function resetForm(){$('productForm').reset();$('editId').value='';$('saveProduct').textContent='商品を追加';$('cancelEdit').hidden=true}
$('cancelEdit').onclick=resetForm;
$('productForm').onsubmit=e=>{e.preventDefault();const name=$('productName').value.trim(),price=Number($('productPrice').value),id=Number($('editId').value);if(!name||name.length>60||!Number.isSafeInteger(price)||price<1||price>999999){notice('商品名と1～999,999円の整数価格を入力してください。','notice error');return}let next;if(id){next={...db,products:db.products.map(p=>p.id===id?{...p,name,price}:p)}}else{next={...db,products:[...db.products,{id:db.nextProductId,name,price,active:true}],nextProductId:db.nextProductId+1}}if(save(next)){resetForm();render();notice('商品を保存しました。','notice success')}};
function renderSales(){
 const date=$('salesDate').value;
 const sales=db.sales.filter(s=>{const d=new Date(s.at);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')===date});
 const revenue=sales.reduce((a,s)=>a+s.total,0),units=sales.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.quantity,0),0);
 $('summary').textContent=(date||'日付を選択')+'の集計｜会計確定分のみ';
 const kpis=$('kpis');kpis.replaceChildren();
 for(const [label,value] of [['売上合計',yen(revenue)],['会計件数',sales.length+'件'],['客単価',sales.length?yen(Math.round(revenue/sales.length)):'—']]){
  const box=el('div','', 'kpi');box.append(el('span',label),el('strong',value));kpis.append(box)
 }
 const productMap=new Map();for(const sale of sales)for(const item of sale.items){const key=item.productId+'|'+item.name+'|'+item.unitPrice;const current=productMap.get(key)||{name:item.name,units:0,revenue:0};current.units+=item.quantity;current.revenue+=item.subtotal;productMap.set(key,current)}
 const products=[...productMap.values()].sort((a,b)=>b.revenue-a.revenue||b.units-a.units),productChart=$('productChart');productChart.replaceChildren();
 if(!products.length)productChart.append(el('div','この日の売上はまだありません。','empty'));
 else{const max=products[0].revenue;for(const product of products){const row=el('div','', 'barrow');const label=el('span',product.name+'（'+product.units+'点）','barlabel');label.title=product.name+' '+product.units+'点';const track=el('div','', 'track'),fill=el('div','', 'fill');fill.style.width=(product.revenue/max*100)+'%';track.append(fill);row.append(label,track,el('span',yen(product.revenue),'barval'));productChart.append(row)}}
 const perHour=Array(24).fill(0);for(const sale of sales)perHour[new Date(sale.at).getHours()]+=sale.total;
 const hourChart=$('hourChart');hourChart.replaceChildren();
 if(!sales.length)hourChart.append(el('div','会計すると時間帯別の売上が表示されます。','empty'));
 else{const wrap=el('div','', 'hours'),max=Math.max(...perHour);for(let h=0;h<24;h++){const col=el('div','', 'hour'),bar=el('div','', 'hourbar'+(perHour[h]===max?' peak':''));bar.style.height=perHour[h]?Math.max(4,Math.round(perHour[h]/max*150))+'px':'0';bar.title=h+'時台 '+yen(perHour[h]);col.append(bar,el('small',h%3===0?String(h):''));wrap.append(col)}hourChart.append(wrap,el('div','棒にカーソルを合わせると金額を確認できます。最高の時間帯は濃い青で表示。','chartnote'))}
 const rows=$('salesRows');rows.replaceChildren();sales.slice().reverse().forEach(s=>{const tr=el('tr');const btn=el('button','レシート');btn.onclick=()=>{showTab('register');renderReceipt(s);$('receipt').scrollIntoView({behavior:'smooth'})};const td=el('td');td.append(btn);tr.append(el('td','#'+s.id),el('td',new Date(s.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})),el('td',String(s.items.reduce((a,i)=>a+i.quantity,0))),el('td',yen(s.total),'num'),td);rows.append(tr)})
}
$('salesDate').value=today();$('salesDate').addEventListener('change',renderSales);render();
</script></body></html>
